name: Fetch Game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install requests beautifulsoup4

      - name: Crawl game
        run: |
          cat > /tmp/crawler.py <<'PY'
          import os
          import re
          from collections import deque
          from urllib.parse import urljoin, urlparse, unquote

          import requests
          from bs4 import BeautifulSoup

          START_URL = "https://gx-launcher.github.io/game/classic-0.0.11a-wasm/index.html"

          session = requests.Session()
          session.headers["User-Agent"] = "Mozilla/5.0"

          allowed_host = urlparse(START_URL).netloc

          queue = deque([START_URL])
          visited = set()

          extensions = (
              ".html",
              ".htm",
              ".js",
              ".wasm",
              ".epk",
              ".data",
              ".pak",
              ".bin",
              ".json",
              ".css",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".svg",
              ".ico",
              ".zip",
          )

          def get_filename(url):
              path = unquote(urlparse(url).path)
              filename = os.path.basename(path)

              if not filename:
                  filename = "index.html"

              filename = filename.split("?")[0]

              return filename

          def make_url(value, current_url):
              value = value.strip().strip("\"'`")

              if not value:
                  return None

              if value.startswith((
                  "#",
                  "data:",
                  "javascript:",
                  "mailto:",
                  "blob:",
                  "about:",
              )):
                  return None

              url = urljoin(current_url, value)
              parsed = urlparse(url)

              if parsed.scheme not in ("http", "https"):
                  return None

              if parsed.netloc != allowed_host:
                  return None

              return url

          def extract_urls(text, current_url):
              found = set()

              try:
                  soup = BeautifulSoup(
                      text,
                      "html.parser"
                  )

                  for tag in soup.find_all(True):
                      for attr in (
                          "src",
                          "href",
                          "data-src",
                          "data-url",
                          "data-file",
                          "data-path",
                      ):
                          value = tag.get(attr)

                          if value:
                              url = make_url(
                                  value,
                                  current_url
                              )

                              if url:
                                  found.add(url)

              except Exception:
                  pass

              # Look for quoted asset paths in JS/CSS.
              pattern = r'''["'`]([^"'`]{1,500})["'`]'''

              for value in re.findall(
                  pattern,
                  text
              ):
                  value = value.strip()

                  if not value:
                      continue

                  lower = value.lower()

                  looks_like_file = any(
                      lower.split("?")[0].endswith(ext)
                      for ext in extensions
                  )

                  looks_like_path = (
                      "/" in value
                      or value.startswith(
                          ("./", "../", "/")
                      )
                  )

                  if not (
                      looks_like_file
                      or looks_like_path
                  ):
                      continue

                  # Ignore normal JavaScript sentences.
                  if " " in value and not (
                      value.startswith("./")
                      or value.startswith("../")
                  ):
                      continue

                  url = make_url(
                      value,
                      current_url
                  )

                  if url:
                      found.add(url)

              return found

          while queue:
              url = queue.popleft()

              if url in visited:
                  continue

              visited.add(url)

              print("[FETCH]", url)

              try:
                  response = session.get(
                      url,
                      timeout=60
                  )
                  response.raise_for_status()

              except Exception as error:
                  print("[ERROR]", error)
                  continue

              filename = get_filename(
                  response.url
              )

              # Don't overwrite files from different URLs.
              if os.path.exists(filename):
                  base, ext = os.path.splitext(filename)
                  number = 1

                  while os.path.exists(
                      f"{base}_{number}{ext}"
                  ):
                      number += 1

                  filename = (
                      f"{base}_{number}{ext}"
                  )

              print("[SAVE]", filename)

              with open(filename, "wb") as file:
                  file.write(response.content)

              content_type = response.headers.get(
                  "content-type",
                  ""
              ).lower()

              is_text = (
                  "text/" in content_type
                  or "javascript" in content_type
                  or "json" in content_type
                  or filename.lower().endswith(
                      (
                          ".html",
                          ".htm",
                          ".js",
                          ".css",
                          ".json",
                          ".txt",
                      )
                  )
              )

              if not is_text:
                  continue

              try:
                  text = response.text
              except Exception:
                  continue

              for discovered in extract_urls(
                  text,
                  response.url
              ):
                  if discovered not in visited:
                      queue.append(discovered)

          print()
          print("================================")
          print("CRAWL COMPLETE")
          print("================================")
          print("URLs visited:", len(visited))

          print()
          print("Downloaded game files:")

          for filename in sorted(os.listdir(".")):
              if os.path.isfile(filename):
                  print(filename)

          print()
          print("Possible archives:")

          for filename in sorted(os.listdir(".")):
              if filename.lower().endswith(
                  (
                      ".epk",
                      ".pak",
                      ".data",
                      ".zip",
                      ".bin",
                  )
              ):
                  print(filename)

          PY

          python3 /tmp/crawler.py

      - name: Show downloaded files
        run: |
          echo "================================"
          echo "FILES TO COMMIT"
          echo "================================"

          git status --short

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fetch game assets"
            git push
          fi
