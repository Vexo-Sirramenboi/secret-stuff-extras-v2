name: Crawl Game Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install requests beautifulsoup4

      - name: Crawl game
        run: |
          cat > crawler.py <<'PY'
          import os
          import re
          from collections import deque
          from urllib.parse import urljoin, urlparse, unquote

          import requests
          from bs4 import BeautifulSoup

          START_URL = "https://gx-launcher.github.io/game/classic-0.0.11a-wasm/index.html"
          OUTPUT_DIR = "game"

          session = requests.Session()
          session.headers["User-Agent"] = "Mozilla/5.0 AssetCrawler/1.0"

          start_host = urlparse(START_URL).netloc

          queue = deque([START_URL])
          visited = set()

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def make_local_path(url):
              parsed = urlparse(url)
              path = unquote(parsed.path)

              if not path or path.endswith("/"):
                  path += "index.html"

              path = path.lstrip("/")

              return os.path.join(OUTPUT_DIR, path)

          def find_urls(text, current_url):
              results = set()

              patterns = [
                  r'''(?:src|href|data-src|data-url)\s*=\s*["']([^"']+)["']''',
                  r'''url\(\s*["']?([^"')]+)["']?\s*\)''',
                  r'''["']([^"']+\.(?:js|wasm|epk|data|pak|zip|json|css|png|jpg|jpeg|gif|svg|ico|bin|txt|webp)(?:\?[^"']*)?)["']''',
              ]

              for pattern in patterns:
                  for match in re.findall(pattern, text, re.IGNORECASE):
                      results.add(match)

              try:
                  soup = BeautifulSoup(text, "html.parser")

                  for tag in soup.find_all(True):
                      for attr in ("src", "href", "data-src", "data-url"):
                          value = tag.get(attr)

                          if value:
                              results.add(value)

              except Exception:
                  pass

              urls = set()

              for value in results:
                  value = value.strip()

                  if not value:
                      continue

                  if value.startswith(
                      ("#", "data:", "javascript:", "mailto:")
                  ):
                      continue

                  absolute = urljoin(current_url, value)
                  parsed = urlparse(absolute)

                  if parsed.scheme not in ("http", "https"):
                      continue

                  if parsed.netloc != start_host:
                      continue

                  urls.add(absolute)

              return urls

          while queue:
              url = queue.popleft()

              if url in visited:
                  continue

              visited.add(url)

              print("[FETCH]", url)

              try:
                  response = session.get(url, timeout=30)
                  response.raise_for_status()
              except Exception as error:
                  print("[ERROR]", error)
                  continue

              local_file = make_local_path(url)

              os.makedirs(os.path.dirname(local_file), exist_ok=True)

              with open(local_file, "wb") as file:
                  file.write(response.content)

              content_type = response.headers.get(
                  "content-type", ""
              ).lower()

              if (
                  "text/" in content_type
                  or "javascript" in content_type
                  or "json" in content_type
                  or local_file.endswith(
                      (".html", ".htm", ".js", ".css", ".json", ".txt")
                  )
              ):
                  try:
                      text = response.text

                      for discovered_url in find_urls(text, url):
                          if discovered_url not in visited:
                              queue.append(discovered_url)

                  except Exception as error:
                      print("[PARSE ERROR]", error)

          print()
          print("========== CRAWL COMPLETE ==========")
          print("Files downloaded:", len(visited))

          print()
          print("========== EPK FILES ==========")

          epk_found = False

          for root, directories, files in os.walk(OUTPUT_DIR):
              for filename in files:
                  if filename.lower().endswith(".epk"):
                      epk_found = True
                      print(os.path.join(root, filename))

          if not epk_found:
              print("No EPK files found.")

          PY

          python3 crawler.py

      - name: List downloaded files
        run: |
          echo "========== FILES =========="
          find game -type f | sort

          echo
          echo "========== EPK FILES =========="
          find game -type f -iname "*.epk" -print || true

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: game-assets
          path: game
          if-no-files-found: warn
