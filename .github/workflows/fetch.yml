name: Crawl Game Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install crawler dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Crawl website
        run: |
          cat > crawler.py <<'PY'
          import os
          import re
          import sys
          from collections import deque
          from urllib.parse import urljoin, urlparse, unquote

          import requests
          from bs4 import BeautifulSoup

          START = "https://gx-launcher.github.io/game/classic-0.0.11a-wasm/index.html"
          OUTPUT = "game"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 GitHubActions AssetCrawler/1.0"
          })

          start_host = urlparse(START).netloc
          start_path = urlparse(START).path
          base_dir = start_path.rsplit("/", 1)[0] + "/"

          queue = deque([START])
          visited = set()

          os.makedirs(OUTPUT, exist_ok=True)

          def local_path(url):
              parsed = urlparse(url)
              path = unquote(parsed.path)

              if not path or path.endswith("/"):
                  path += "index.html"

              # Prevent absolute paths from escaping OUTPUT.
              path = path.lstrip("/")

              return os.path.join(OUTPUT, path)

          def extract_urls(text, current_url):
              found = set()

              # HTML/CSS/JS style URLs.
              patterns = [
                  r'''(?:src|href|data-src|data-url)\s*=\s*["']([^"']+)["']''',
                  r'''url\(\s*["']?([^"')]+)["']?\s*\)''',
                  r'''["']([^"']+\.(?:js|wasm|epk|data|pak|zip|json|css|png|jpg|jpeg|gif|svg|ico|bin|txt|webp)(?:\?[^"']*)?)["']''',
              ]

              for pattern in patterns:
                  for match in re.findall(pattern, text, re.I):
                      found.add(match)

              # Let BeautifulSoup catch normal HTML references too.
              try:
                  soup = BeautifulSoup(text, "html.parser")

                  for tag in soup.find_all(True):
                      for attr in ("src", "href", "data-src", "data-url"):
                          value = tag.get(attr)
                          if value:
                              found.add(value)
              except Exception:
                  pass

              urls = set()

              for value in found:
                  value = value.strip()

                  if not value:
                      continue

                  if value.startswith(("#", "data:", "javascript:", "mailto:")):
                      continue

                  absolute = urljoin(current_url, value)
                  parsed = urlparse(absolute)

                  if parsed.scheme not in ("http", "https"):
                      continue

                  # Stay on the same host.
                  if parsed.netloc != start_host:
                      continue

                  urls.add(absolute)

              return urls

          while queue:
              url = queue.popleft()

              if url in visited:
                  continue

              visited.add(url)

              print(f"[FETCH] {url}")

              try:
                  response = session.get(url, timeout=30)
                  response.raise_for_status()
              except Exception as e:
                  print(f"[ERROR] {url}: {e}")
                  continue

              path = local_path(url)
              os.makedirs(os.path.dirname(path), exist_ok=True)

              with open(path, "wb") as f:
                  f.write(response.content)

              content_type = response.headers.get("content-type", "").lower()

              # Parse text-based resources for more URLs.
              if (
                  "text/" in content_type
                  or "javascript" in content_type
                  or "json" in content_type
                  or path.endswith((".html", ".htm", ".js", ".css", ".json", ".txt"))
              ):
                  try:
                      text = response.text

                      for discovered in extract_urls(text, url):
                          if discovered not in visited:
                              queue.append(discovered)

                  except Exception as e:
                      print(f"[PARSE ERROR] {url}: {e}")

          print()
          print("========== CRAWL COMPLETE ==========")
          print(f"Files downloaded: {len(visited)}")

          print()
          print("========== EPK FILES ==========")

          found_epk = False

          for root, dirs, files in os.walk(OUTPUT):
              for filename in files:
                  if filename.lower().endswith(".epk"):
                      found_epk = True
                      print(os.path.join(root, filename))

          if not found_epk:
              print("No .epk files found.")

          PY

          python3 crawler.py

      - name: Show downloaded files
        run: |
          echo "========== DOWNLOADED FILES =========="
          find game -type f -print | sort

          echo
          echo "========== EPK FILES =========="
          find game -type f \( -iname "*.epk" -o -iname "*.EPK" \) -print || true

      - name: Upload crawled assets
        uses: actions/upload-artifact@v4
        with:
          name: game-assets
          path: game/
          if-no-files-found: error
:::

### What you'll get

After running **Actions → Crawl Game Assets**, the workflow creates an artifact called **`game-assets`** containing the discovered files.

For example, if the crawler discovers:

```text
index.html
game.js
game.wasm
assets.epk
some-data.data
