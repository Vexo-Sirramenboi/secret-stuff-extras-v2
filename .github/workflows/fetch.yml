name: Crawl Game Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install requests beautifulsoup4

      - name: Crawl game
        run: |
          cat > crawler.py <<'PY'
          import os
          import re
          from collections import deque
          from urllib.parse import urljoin, urlparse, unquote

          import requests
          from bs4 import BeautifulSoup

          START_URL = "https://gx-launcher.github.io/game/classic-0.0.11a-wasm/index.html"

          session = requests.Session()
          session.headers["User-Agent"] = "Mozilla/5.0 AssetCrawler/1.0"

          allowed_host = urlparse(START_URL).netloc

          queue = deque([START_URL])
          visited = set()

          extensions = (
              ".html",
              ".htm",
              ".js",
              ".wasm",
              ".epk",
              ".data",
              ".pak",
              ".bin",
              ".json",
              ".css",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".svg",
              ".ico",
              ".zip",
          )

          def filename_for(url):
              path = unquote(urlparse(url).path)
              filename = os.path.basename(path)

              if not filename:
                  filename = "index.html"

              # Remove query-string-like junk from filenames.
              filename = filename.split("?")[0]

              return filename

          def unique_filename(filename):
              if not os.path.exists(filename):
                  return filename

              name, ext = os.path.splitext(filename)

              number = 1

              while True:
                  candidate = f"{name}_{number}{ext}"

                  if not os.path.exists(candidate):
                      return candidate

                  number += 1

          def make_url(value, current_url):
              value = value.strip().strip("\"'`")

              if not value:
                  return None

              if value.startswith((
                  "#",
                  "data:",
                  "javascript:",
                  "mailto:",
                  "blob:",
                  "about:",
              )):
                  return None

              url = urljoin(current_url, value)
              parsed = urlparse(url)

              if parsed.scheme not in ("http", "https"):
                  return None

              if parsed.netloc != allowed_host:
                  return None

              return url

          def extract_html(text, current_url):
              found = set()

              soup = BeautifulSoup(text, "html.parser")

              for tag in soup.find_all(True):
                  for attr in (
                      "src",
                      "href",
                      "data-src",
                      "data-url",
                      "data-file",
                      "data-path",
                  ):
                      value = tag.get(attr)

                      if value:
                          url = make_url(
                              value,
                              current_url
                          )

                          if url:
                              found.add(url)

              return found

          def extract_text(text, current_url):
              found = set()

              # Only consider quoted strings that look like
              # paths/files rather than arbitrary JavaScript.
              pattern = r'''["'`]([^"'`]{1,500})["'`]'''

              for value in re.findall(pattern, text):

                  value = value.strip()

                  if not value:
                      continue

                  lower = value.lower()

                  looks_like_file = any(
                      lower.split("?")[0].endswith(ext)
                      for ext in extensions
                  )

                  looks_like_path = (
                      "/" in value
                      or value.startswith(
                          ("./", "../", "/")
                      )
                  )

                  if not (
                      looks_like_file
                      or looks_like_path
                  ):
                      continue

                  # Don't treat normal sentences as paths.
                  if " " in value and not (
                      value.startswith("./")
                      or value.startswith("../")
                  ):
                      continue

                  url = make_url(
                      value,
                      current_url
                  )

                  if url:
                      found.add(url)

              return found

          while queue:

              url = queue.popleft()

              if url in visited:
                  continue

              visited.add(url)

              print()
              print("[FETCH]", url)

              try:
                  response = session.get(
                      url,
                      timeout=60
                  )

                  response.raise_for_status()

              except Exception as error:
                  print("[ERROR]", error)
                  continue

              filename = filename_for(
                  response.url
              )

              filename = unique_filename(
                  filename
              )

              print("[SAVE ]", filename)

              with open(filename, "wb") as file:
                  file.write(response.content)

              content_type = response.headers.get(
                  "content-type",
                  ""
              ).lower()

              is_text = (
                  "text/" in content_type
                  or "javascript" in content_type
                  or "json" in content_type
                  or filename.lower().endswith(
                      (
                          ".html",
                          ".htm",
                          ".js",
                          ".css",
                          ".json",
                          ".txt",
                      )
                  )
              )

              if not is_text:
                  continue

              try:
                  text = response.text
              except Exception:
                  continue

              discovered = set()

              if filename.lower().endswith(
                  (".html", ".htm")
              ):
                  discovered |= extract_html(
                      text,
                      response.url
                  )

              discovered |= extract_text(
                  text,
                  response.url
              )

              for new_url in sorted(discovered):

                  if new_url not in visited:
                      queue.append(new_url)
                      print(
                          "[DISCOVER]",
                          new_url
                      )

          print()
          print("=" * 60)
          print("CRAWL COMPLETE")
          print("=" * 60)

          print(
              "URLs visited:",
              len(visited)
          )

          print()
          print("Root files:")

          for filename in sorted(
              os.listdir(".")
          ):
              if os.path.isfile(filename):
                  print(filename)

          print()
          print("=" * 60)
          print("GAME ARCHIVES")
          print("=" * 60)

          found = False

          for filename in sorted(
              os.listdir(".")
          ):

              if filename.lower().endswith(
                  (
                      ".epk",
                      ".pak",
                      ".data",
                      ".zip",
                      ".bin",
                  )
              ):

                  found = True

                  size = os.path.getsize(
                      filename
                  )

                  print(
                      filename,
                      "(",
                      size,
                      "bytes)"
                  )

          if not found:
              print("No obvious archives found.")

          PY

          python3 crawler.py

      - name: List downloaded files
        run: |
          echo "================================"
          echo "DOWNLOADED FILES"
          echo "================================"

          find . -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: game-assets
          path: |
            *.html
            *.htm
            *.js
            *.wasm
            *.epk
            *.data
            *.pak
            *.bin
            *.json
            *.css
            *.png
            *.jpg
            *.jpeg
            *.gif
            *.webp
            *.svg
            *.ico
            *.zip
          if-no-files-found: warn
